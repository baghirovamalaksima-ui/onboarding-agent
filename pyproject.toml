[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "onboarding-agent"
version = "0.1.0"
description = "Bounded tool-calling agent for a synthetic appointment API"
requires-python = ">=3.11"
readme = "README.md"
dependencies = ["fastapi>=0.115,<1", "httpx>=0.28,<1", "uvicorn>=0.34,<1", "pydantic>=2.10,<3"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]
openai = ["openai>=2,<3"]

[project.scripts]
onboarding-demo = "onboarding.demo:main"

[tool.setuptools.packages.find]
include = ["onboarding*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
